{% extends 'base.html' %}
{% block title %}Audit Trail{% endblock %}
{% block content %}
<h1>Audit Trail</h1>
<table class="table">
  <thead><tr><th>Event ID</th><th>Entity</th><th>Action</th><th>User</th><th>Timestamp</th></tr></thead>
  <tbody>
    {% for row in audits %}
    <tr><td>{{ row.event_id }}</td><td>{{ row.entity_id }}</td><td>{{ row.action }}</td><td>{{ row.user_name }}</td><td>{{ row.created_at }}</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
